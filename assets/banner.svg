<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter for Glow effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes pulseSignal {
        0%, 100% { stroke-dashoffset: 200; opacity: 0.3; }
        50% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes rippleWave {
        0% { r: 12px; opacity: 1; }
        100% { r: 42px; opacity: 0; }
      }
      .signal-line {
        stroke-dasharray: 12, 12;
        animation: pulseSignal 4s linear infinite;
      }
      .floating-node-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .pulsing-orb {
        transform-origin: center;
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .wave-ripple {
        animation: rippleWave 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-origin: center;
      }
      .wave-ripple-2 {
        animation: rippleWave 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        animation-delay: 1.25s;
        transform-origin: center;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.15">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Glowing Background Orbs (Behind content) -->
  <circle cx="200" cy="180" r="160" fill="url(#glowCyan)" class="pulsing-orb" />
  <circle cx="1000" cy="200" r="170" fill="url(#glowPurple)" class="pulsing-orb" style="animation-delay: -2.5s;" />
  <circle cx="600" cy="380" r="140" fill="url(#glowGreen)" class="pulsing-orb" style="animation-delay: -1.2s;" />

  <!-- DYNAMIC BRIDGING NETWORK (Animated Signals) -->
  <g filter="url(#neonGlow)">
    <!-- Circuit Lines Connecting Left Hardware & Right Mobile Node -->
    <path d="M 120 220 Q 240 120, 360 210 T 600 230" fill="none" stroke="#00f2fe" stroke-width="2.5" class="signal-line" />
    <path d="M 600 230 Q 750 290, 880 200 T 1080 210" fill="none" stroke="#9d4edd" stroke-width="2.5" class="signal-line" style="animation-duration: 3.2s;" />
    <path d="M 220 310 C 380 370, 780 370, 980 310" fill="none" stroke="#00f5d4" stroke-width="1.8" class="signal-line" style="animation-duration: 5s;" />
  </g>

  <!-- Left Dynamic Floating Node: Hardware / Microcontroller -->
  <g class="floating-node-1" filter="url(#softShadow)">
    <rect x="70" y="160" width="105" height="105" rx="20" fill="url(#cardGrad)" stroke="#00f2fe" stroke-width="2" />
    <!-- Dynamic WiFi/BLE Waves -->
    <circle cx="122" cy="212" r="14" fill="none" stroke="#00f2fe" stroke-width="2" class="wave-ripple" />
    <circle cx="122" cy="212" r="14" fill="none" stroke="#00f2fe" stroke-width="1.5" class="wave-ripple-2" />
    <circle cx="122" cy="212" r="7" fill="#00f2fe" />
    <!-- Chip Icon Detail -->
    <text x="122" y="245" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">ESP32 / MCU</text>
  </g>

  <!-- Right Dynamic Floating Node: Smartphone / Companion App -->
  <g class="floating-node-2" filter="url(#softShadow)">
    <rect x="1025" y="150" width="85" height="135" rx="18" fill="url(#cardGrad)" stroke="#9d4edd" stroke-width="2" />
    <rect x="1037" y="166" width="61" height="96" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
    <!-- Screen dynamic indicators -->
    <line x1="1045" y1="185" x2="1089" y2="185" stroke="#00f5d4" stroke-width="3" stroke-linecap="round" />
    <line x1="1045" y1="200" x2="1075" y2="200" stroke="#4facfe" stroke-width="3" stroke-linecap="round" />
    <line x1="1045" y1="215" x2="1082" y2="215" stroke="#9d4edd" stroke-width="3" stroke-linecap="round" />
    <!-- Home Bar -->
    <circle cx="1067" cy="250" r="3" fill="#64748b" />
    <text x="1067" y="274" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">SMARTPHONE</text>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Always Clear and Prominent) -->
  <g filter="url(#softShadow)">
    <!-- Main Title -->
    <text x="600" y="135" text-anchor="middle" fill="url(#titleGrad)" font-size="46" class="title-text" filter="url(#neonGlow)">
      Awesome IoT &amp; Smartphone Bridging
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="180" text-anchor="middle" fill="url(#tagGrad)" font-size="18" class="sub-text">
      The Ultimate Directory for Hardware Telemetry, Smart Home Hubs, BLE &amp; MQTT Mobile Dashboards
    </text>
  </g>

  <!-- Animated Feature Badges / Pills in Foreground (Clear & Readable) -->
  <g transform="translate(195, 290)">
    <!-- Pill 1: ESP32 &amp; BLE -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="19" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#00f2fe" />
      <text x="36" y="24" fill="#f8fafc" font-size="13" font-weight="600" font-family="sans-serif">ESP32 &amp; BLE Bridges</text>
    </g>

    <!-- Pill 2: Home Automation -->
    <g transform="translate(195, 0)">
      <rect width="195" height="38" rx="19" fill="#0f172a" stroke="#4facfe" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#4facfe" />
      <text x="36" y="24" fill="#f8fafc" font-size="13" font-weight="600" font-family="sans-serif">Home Automation Hubs</text>
    </g>

    <!-- Pill 3: MQTT Brokers -->
    <g transform="translate(405, 0)">
      <rect width="190" height="38" rx="19" fill="#0f172a" stroke="#9d4edd" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#9d4edd" />
      <text x="36" y="24" fill="#f8fafc" font-size="13" font-weight="600" font-family="sans-serif">MQTT &amp; Telemetry</text>
    </g>

    <!-- Pill 4: Mobile Dashboards -->
    <g transform="translate(610, 0)">
      <rect width="195" height="38" rx="19" fill="#0f172a" stroke="#00f5d4" stroke-width="1.5" />
      <circle cx="22" cy="19" r="6" fill="#00f5d4" />
      <text x="36" y="24" fill="#f8fafc" font-size="13" font-weight="600" font-family="sans-serif">Mobile UI Dashboards</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="300" y1="365" x2="900" y2="365" stroke="url(#titleGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
</svg>
